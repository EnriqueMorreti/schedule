<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Розклад занять</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f3fbfe;
      --surface: #fff;
      --ink: #183340;
      --muted: #6b8794;
      --line: #dcecf3;
      --blue-soft: #e9f8fe;
      --blue: #43849e;
      --today: #dff4fb;
      --radius: 22px;
      --shadow: 0 18px 50px rgba(69, 133, 157, 0.10);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app-shell {
      max-width: 55%;
      width: 100%;
      transition: max-width 0.3s ease;
    }

    .schedule-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 20px;
      transition: all 0.3s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      gap: 16px;
      flex-wrap: wrap;
    }

    .kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 34px;
      letter-spacing: -0.04em;
      line-height: 1.1;
      font-weight: 600;
    }

    .group-badge {
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .day-filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .day-filter-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: 0.15s ease;
      font-family: inherit;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .day-filter-btn:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    .day-filter-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      box-shadow: 0 2px 6px rgba(67, 132, 158, 0.25);
    }

    .day-filter-btn.today-highlight {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 600;
    }

    .day-filter-btn.today-highlight.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .day-filter-btn.reset-btn {
      background: transparent;
      color: var(--muted);
      border-color: transparent;
    }
    .day-filter-btn.reset-btn:hover {
      background: var(--blue-soft);
      border-color: var(--line);
      color: var(--ink);
    }
    .day-filter-btn.reset-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .table-wrap {
      overflow-x: auto;
      padding: 16px 0 10px;
      -webkit-overflow-scrolling: touch;
      transition: all 0.3s ease;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    table.filtered {
      max-width: 400px;
      min-width: unset;
      width: auto;
    }

    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    thead th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--blue-soft);
      font-weight: 600;
      padding: 14px 12px;
      transition: background 0.15s;
    }

    thead th:first-child { border-radius: 12px 0 0 12px; }
    thead th:last-child { border-radius: 0 12px 12px 0; }

    thead th.today {
      color: var(--ink);
      background: var(--today);
      box-shadow: inset 0 3px 0 var(--blue);
    }

    td.today {
      background: rgba(223, 244, 251, 0.4);
    }

    td.current-lesson {
      background: #c5e8f3 !important;
      border-left: 4px solid var(--blue);
      box-shadow: inset 0 0 0 1px var(--blue);
      position: relative;
    }

    .today-label {
      display: block;
      margin-top: 4px;
      color: var(--blue);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: none;
      font-weight: 500;
    }

    .time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      padding-top: 18px;
    }

    .lesson strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }

    .teacher {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .room, .note {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .room {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .note {
      margin-left: 6px;
      background: #fff3cd;
      color: #856404;
    }

    .empty {
      color: #a8bcc4;
      text-align: center;
      padding-top: 20px;
      font-size: 13px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-left {
      color: #5b9aae;
      font-weight: 500;
    }

    @media (max-width: 1000px) {
      .app-shell {
        max-width: 80%;
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        max-width: 100%;
      }
      .schedule-card {
        padding: 18px 14px 16px;
        border-radius: 18px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      h1 {
        font-size: 28px;
      }
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .day-filter-group {
        flex-wrap: wrap;
        gap: 6px;
      }
      .day-filter-btn {
        padding: 6px 14px;
        font-size: 12px;
        flex: 1 0 auto;
        text-align: center;
      }
      .table-wrap {
        padding: 8px 0 8px;
      }
      table {
        font-size: 13px;
      }
      table.filtered {
        max-width: 100%;
        width: 100%;
      }
      th, td {
        padding: 10px 8px;
      }
      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .schedule-card {
        padding: 12px 10px;
        border-radius: 14px;
      }
      h1 {
        font-size: 24px;
      }
      .group-badge {
        font-size: 12px;
        padding: 5px 12px;
      }
      .day-filter-btn {
        font-size: 11px;
        padding: 4px 12px;
      }
      table {
        font-size: 12px;
      }
      table.filtered {
        max-width: 100%;
        width: 100%;
      }
      th, td {
        padding: 8px 6px;
      }
      .time {
        font-size: 11px;
        padding-top: 14px;
      }
      .lesson strong {
        font-size: 12px;
      }
      .teacher {
        font-size: 11px;
      }
      .room, .note {
        font-size: 10px;
        padding: 2px 5px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="schedule-card">
      <header class="header">
        <div>
          <p class="kicker">Навчання · 1 семестр</p>
          <h1>Розклад занять</h1>
        </div>
        <span class="group-badge">ЕМ-26 1/9</span>
      </header>

      <div class="filter-bar">
        <div class="day-filter-group" id="dayFilterGroup">
          <button class="day-filter-btn reset-btn" data-day="all">Усі дні</button>
          <button class="day-filter-btn" data-day="1">Пн</button>
          <button class="day-filter-btn" data-day="2">Вт</button>
          <button class="day-filter-btn" data-day="3">Ср</button>
          <button class="day-filter-btn" data-day="4">Чт</button>
          <button class="day-filter-btn" data-day="5">Пт</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="schedule">
          <thead id="tableHead">
            <tr id="headerRow">
              <th>Час</th>
              <th data-day="1">Понеділок</th>
              <th data-day="2">Вівторок</th>
              <th data-day="3">Середа</th>
              <th data-day="4">Четвер</th>
              <th data-day="5">П'ятниця</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <footer>
        <div>kirulove</div>
        <div>Оновлено: 02.09.2026</div>
      </footer>
    </section>
  </main>

  <script>
    (function() {
      const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт'];
      const scheduleData = [
        {
          time: '09:00-10:20',
          Пн: null,
          Вт: { name: 'Основи автоматики і робототехніки', teacher: 'Цуркан М.В.', room: '339', note: 'ГР-26' },
          Ср: { name: 'Фізична культура', teacher: 'Хорошенко Л.В.', room: '' },
          Чт: { name: 'Математика', teacher: 'Кулигіна Л.І.', room: '208' },
          Пт: { name: 'Українська література', teacher: 'Дьогтєва Т.Л.', room: '317' }
        },
        {
          time: '10:30-11:50',
          Пн: null,
          Вт: { name: 'Всесвітня історія', teacher: 'Баннова І.В.', room: '128' },
          Ср: { name: 'Українська мова', teacher: 'Ус І.В.', room: '213' },
          Чт: { name: 'Основи підприємницької діяльності', teacher: 'Пуляєва К.М.', room: '403' },
          Пт: { name: 'Іноземна мова', teacher: 'Холошенко О.В.', room: '316' }
        },
        {
          time: '12:20-13:40',
          Пн: { name: 'Природничі науки', teacher: 'Янбих М.О.', room: '302' },
          Вт: { name: 'Захист України', teacher: 'Терентьєв С.Б.', room: '202' },
          Ср: { name: 'Математика', teacher: 'Кулигіна Л.І.', room: '208' },
          Чт: { name: 'Інформатика', teacher: 'Короткевич Я.Ю.', room: '414' },
          Пт: { name: 'Природничі науки', teacher: 'Янбих М.О.', room: '302' }
        },
        {
          time: '13:50-15:10',
          Пн: { name: 'Природничі науки', teacher: 'Янбих М.О.', room: '302' },
          Вт: { name: 'Всесвітня історія', teacher: 'Баннова І.В.', room: '128' },
          Ср: { name: 'Виховна година', teacher: 'Олена Олександрівна', room: '418' },
          Чт: { name: 'Основи підприємницької діяльності', teacher: 'Пуляєва К.М.', room: '403', note: 'МЛ-26' },
          Пт: { name: 'Українська література', teacher: 'Дьогтєва Т.Л.', room: '317' }
        }
      ];

      const currentDay = new Date().getDay();
      const isWeekend = (currentDay === 0 || currentDay === 6);
      const defaultDay = isWeekend ? 'all' : String(currentDay);
      const todayIndex = (currentDay >= 1 && currentDay <= 5) ? currentDay : 0;

      if (todayIndex) {
        const todayHeader = document.querySelector(`thead th[data-day="${todayIndex}"]`);
        if (todayHeader) {
          todayHeader.classList.add('today');
          const label = document.createElement('span');
          label.className = 'today-label';
          label.textContent = 'сьогодні';
          todayHeader.appendChild(label);
        }
      }

      function getCurrentLessonIndex() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        // const hours = 10
        // const minutes = 29
        const totalMinutes = hours * 60 + minutes;

        const slots = scheduleData.map(slot => {
          const [start, end] = slot.time.split('-');
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          return {
            start: startH * 60 + startM,
            end: endH * 60 + endM
          };
        });

        const lastSlot = slots[slots.length - 1];
        if (totalMinutes > lastSlot.end) {
          return -1;
        }

        if (totalMinutes < slots[0].start) {
          return 0;
        }

        for (let i = 0; i < slots.length; i++) {
          if (totalMinutes >= slots[i].start && totalMinutes < slots[i].end) {
            return i;
          }
          if (i < slots.length - 1) {
            if (totalMinutes >= slots[i].end && totalMinutes < slots[i + 1].start) {
              return i + 1;
            }
          }
        }

        return -1;
      }

      const currentLessonIndex = (todayIndex !== 0) ? getCurrentLessonIndex() : -1;

      const tbody = document.getElementById('tableBody');
      const headerRow = document.getElementById('headerRow');
      const table = document.getElementById('schedule');
      const filterGroup = document.getElementById('dayFilterGroup');
      let activeDay = defaultDay;

      function highlightTodayInFilter() {
        const buttons = filterGroup.querySelectorAll('.day-filter-btn');
        buttons.forEach(btn => {
          btn.classList.remove('today-highlight');
          const dayVal = btn.dataset.day;
          if (dayVal !== 'all' && String(todayIndex) === dayVal) {
            btn.classList.add('today-highlight');
          }
        });
      }

      function renderTable(filterDay) {
        tbody.innerHTML = '';

        const headerCells = headerRow.querySelectorAll('th');
        headerCells.forEach((th, index) => {
          if (index === 0) {
            th.style.display = '';
            return;
          }
          const dayNum = index;
          if (filterDay === 'all' || String(dayNum) === filterDay) {
            th.style.display = '';
          } else {
            th.style.display = 'none';
          }
        });

        if (filterDay === 'all') {
          table.classList.remove('filtered');
        } else {
          table.classList.add('filtered');
        }

        scheduleData.forEach((slot, rowIndex) => {
          const row = document.createElement('tr');
          const timeCell = document.createElement('th');
          timeCell.className = 'time';
          timeCell.textContent = slot.time;
          row.appendChild(timeCell);

          days.forEach((day, index) => {
            const dayNum = index + 1;
            const lesson = slot[day];
            const cell = document.createElement('td');

            if (filterDay !== 'all' && String(dayNum) !== filterDay) {
              cell.style.display = 'none';
            } else {
              if (todayIndex === dayNum) {
                cell.classList.add('today');
                if (rowIndex === currentLessonIndex && currentLessonIndex !== -1) {
                  cell.classList.add('current-lesson');
                }
              }
            }

            if (!lesson) {
              cell.classList.add('empty');
              cell.textContent = '—';
            } else {
              cell.classList.add('lesson');
              let html = `<strong>${lesson.name}</strong>`;
              html += `<span class="teacher">${lesson.teacher || '—'}</span>`;
              if (lesson.room) {
                html += `<span class="room">${lesson.room} аудиторія</span>`;
              }
              if (lesson.note) {
                html += `<span class="note">${lesson.note}</span>`;
              }
              cell.innerHTML = html;
            }
            row.appendChild(cell);
          });

          const cells = row.querySelectorAll('td');
          let visibleCountCells = 0;
          cells.forEach(c => { if (c.style.display !== 'none') visibleCountCells++; });
          if (visibleCountCells === 0) {
            row.style.display = 'none';
          }

          tbody.appendChild(row);
        });

        document.querySelectorAll('.day-filter-btn').forEach(btn => {
          btn.classList.remove('active');
          const dayVal = btn.dataset.day;
          if (dayVal === filterDay || (dayVal === 'all' && filterDay === 'all')) {
            btn.classList.add('active');
          }
        });

        highlightTodayInFilter();
      }

      filterGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.day-filter-btn');
        if (!btn) return;
        const dayVal = btn.dataset.day;
        if (!dayVal) return;
        activeDay = dayVal;
        renderTable(activeDay);
      });

      renderTable(defaultDay);
    })();
  </script>
</body>
</html>
